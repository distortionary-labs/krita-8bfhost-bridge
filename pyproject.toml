[project]
name = "krita-8bfhost-bridge"
version = "0.1.0"
description = "Run Photoshop-compatible filter plug-ins (.8bf) in Krita"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["external", "ref"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B905 (zip strict=) needs Python 3.10; Krita 5 ships 3.8 on some platforms.
ignore = ["E731", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["krita_8bfhost_bridge", "conftest"]
